name: Rebuild Sanity Data

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [update-sanity-data]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install cheerio @sanity/client

      - name: Bake HTML from Sanity
        run: node build_html.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "chore: auto-update HTML from Sanity CMS" || exit 0
          git push
